services:
  - type: web
    name: kaptaa-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaptaa-db
          property: connectionString

databases:
  - name: kaptaa-db
    plan: free
    region: frankfurt
    databaseName: kaptaa_db
    user: kaptaa_db_user
    postgresMajorVersion: "16"
