<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaptaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: premium consumer app, warm, calm, Apple-grade polish
IDEA: a camera roll sorted by a sharp assistant — every screenshot becomes a glossy action card
PICTURE: the live app in a realistic phone (status bar, island, glass tab bar), sunset mesh hero
COLOUR and TYPE: soft white ground, ink #121318, sunset coral #ff6a4d → pink #ff4f8b mesh, per-category tints; Inter Tight + Inter
LAYOUT: pitch left, phone right; phone first and full-bleed on small screens
*/
:root{color-scheme:light dark;--bg:light-dark(#f5f3f1,#0e0e12);--ink:light-dark(#121318,#f4f4f6);--mute:light-dark(#6e7080,#9a9caa);--card:light-dark(#ffffff,#1b1b22);--soft:light-dark(#f0eeec,#23232c);--line:light-dark(rgba(18,19,24,.07),rgba(255,255,255,.08));--app:light-dark(#f7f6f4,#101015);--glass:light-dark(rgba(255,255,255,.78),rgba(28,28,36,.78));--coral:#ff6a4d;--pink:#ff4f8b;--peach:#ffb37a;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(30,20,40,.18)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.d{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.08}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:2px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(24px,5vw,64px) max(4vw,16px);display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:clamp(28px,6vw,96px);align-items:center}
.pitch h1{font-size:clamp(36px,4.8vw,54px);text-wrap:balance;font-weight:800}
.grad{background:linear-gradient(100deg,var(--coral),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.pitch>p{color:var(--mute);font-size:17px;max-width:48ch;margin:18px 0 26px}
.steps{display:grid;gap:10px;margin-bottom:26px}
.step{display:flex;gap:14px;align-items:center}
.step span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);font:700 15px "Inter Tight";flex:none}
.step b{font-weight:600}.step small{color:var(--mute);display:block;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plan{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.plan.pro{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff}
.plan small{font-size:13px;opacity:.8}.plan .p{font:800 30px "Inter Tight";letter-spacing:-.03em;white-space:nowrap;margin:4px 0}
.plan ul{margin:0;padding-left:16px;font-size:14px}
.note{font-size:13px;color:var(--mute);margin-top:14px}
/* phone */
.phone{background:#0a0a0d;border-radius:54px;padding:11px;box-shadow:0 40px 80px -30px rgba(255,79,139,.45),0 0 0 1.5px #2a2a32,inset 0 0 0 1px #3a3a44}
.app{background:var(--app);border-radius:44px;height:840px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font:600 15px "Inter Tight";position:relative;z-index:3}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:33px;border-radius:20px;background:#000}
.sig{display:flex;gap:5px;align-items:center}
.scr{flex:1;overflow-y:auto;padding:0 18px 130px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 2px 16px}
.hd small{color:var(--mute);font-weight:500;font-size:14px}
.hd h1{font-size:34px;font-weight:800}
.pill{font:600 12.5px Inter;padding:7px 11px;border-radius:99px;background:var(--card);box-shadow:var(--sh);white-space:nowrap}
.pill.pro{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff}
/* hero */
.hero{border-radius:28px;padding:20px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,#ffb37a 0%,transparent 55%),radial-gradient(90% 90% at 100% 10%,#ff4f8b 0%,transparent 60%),linear-gradient(140deg,#ff6a4d,#ff3d77);display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:center;box-shadow:0 18px 36px -18px rgba(255,79,139,.7)}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;bottom:-90px;background:rgba(255,255,255,.14)}
.hero b{font:800 46px "Inter Tight";letter-spacing:-.04em;display:block;line-height:1}
.hero p{margin:6px 0 0;font-size:14.5px;opacity:.95}
.ring{width:92px;height:92px;position:relative;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 17px "Inter Tight"}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec h2{font-size:21px;font-weight:700}.sec small{color:var(--mute);font-size:13px}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.due{flex:none;width:156px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);text-align:left}
.due .dt{font:700 13px Inter;color:var(--c);text-transform:none}
.due h3{font-size:15px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.list{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.todo{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.todo+.todo{border-top:1px solid var(--line)}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid light-dark(#d4d2d0,#44444f);flex:none;margin:0;display:grid;place-items:center;transition:.2s;cursor:pointer}
.chk:checked{background:linear-gradient(135deg,var(--coral),var(--pink));border-color:transparent}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.todo span{flex:1;font-weight:500;font-size:15px}
.todo small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;font-weight:400;margin-top:2px}
.todo small i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.todo.done span>b{text-decoration:line-through;color:var(--mute);font-weight:500}
.todo span>b{font-weight:500}
/* library */
.srch{display:flex;align-items:center;gap:8px;background:light-dark(#ebe9e6,#1f1f27);border-radius:14px;padding:0 12px;margin-bottom:12px}
.srch input{flex:1;border:0;background:none;padding:12px 0;font-size:16px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:500;display:flex;gap:7px;align-items:center;min-height:38px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;color:var(--mute);font-size:12.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--app)}
.chip[aria-pressed=true] em{color:inherit;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .2s}
.tile:active{transform:scale(.97)}
.shot{aspect-ratio:4/5;position:relative;overflow:hidden;background:var(--soft)}
.shot img,.shot svg{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px;padding:4px 9px;font-size:11.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tile .tx{padding:10px 12px 12px}
.tile h3{font-size:14.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{color:var(--mute);font-size:12.5px}
.prog{height:4px;border-radius:4px;background:var(--soft);margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--pink))}
.ld .shot{background:linear-gradient(100deg,var(--soft) 30%,light-dark(#fff,#2b2b35) 50%,var(--soft) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.ld .shot span{position:absolute;inset:auto 0 12px;text-align:center;font-size:12.5px;color:var(--mute);font-weight:500}
.empty{text-align:center;color:var(--mute);padding:40px 16px;grid-column:1/-1}
/* ask */
.sugg{display:grid;gap:10px}
.sg{background:var(--card);border-radius:18px;padding:15px 16px;text-align:left;box-shadow:var(--sh);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sg::after{content:"↗";color:var(--coral);font-weight:700}
.msg{max-width:86%;padding:12px 15px;border-radius:20px;margin-top:10px;white-space:pre-wrap;font-size:15px;line-height:1.5}
.msg.me{margin-left:auto;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;border-bottom-right-radius:6px}
.msg.ai{background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:6px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.compose{position:absolute;left:14px;right:14px;bottom:100px;display:flex;gap:8px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:var(--sh);z-index:3}
.compose input{flex:1;border:0;background:none;outline:none;font-size:16px}
.send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;display:grid;place-items:center;flex:none}
/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:70px;border-radius:26px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 10px 30px -10px rgba(0,0,0,.25),inset 0 0 0 1px var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr;align-items:center;z-index:4;padding:0 6px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);min-height:52px;justify-content:center}
.tb svg{width:23px;height:23px}
.tb[aria-selected=true]{color:var(--ink)}
.tb[aria-selected=true] svg{color:var(--coral)}
.add{width:60px;height:60px;border-radius:22px;margin:0 auto;transform:translateY(-14px);background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -8px rgba(255,79,139,.75);cursor:pointer;transition:transform .15s}
.add:active{transform:translateY(-14px) scale(.94)}
.add svg{width:26px;height:26px}
/* sheet */
.sheet{position:absolute;inset:0;background:rgba(10,8,14,.45);display:none;align-items:flex-end;z-index:6;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.panel{background:var(--app);width:100%;max-height:90%;overflow-y:auto;border-radius:32px 32px 0 0;padding:10px 20px 30px;animation:up .32s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel,.ld .shot,.dots i{animation:none}}
.grab{width:40px;height:5px;border-radius:5px;background:light-dark(#d9d7d4,#3a3a44);margin:0 auto 14px}
.panel .big{border-radius:22px;overflow:hidden;aspect-ratio:16/11;background:var(--soft);margin-bottom:14px}
.panel .big img,.panel .big svg{width:100%;height:100%;object-fit:cover;display:block}
.panel h2{font-size:25px;font-weight:800;margin:10px 0 6px}
.panel>p{color:var(--mute);margin:0 0 14px}
.tg{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tg i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.fact{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}
.fact small{display:block;color:var(--mute);font-size:12px}.fact b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.hash{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.hash span{font-size:13px;color:var(--mute);background:var(--soft);padding:4px 10px;border-radius:99px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:50px;border-radius:16px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--app)}
.btn.gr{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;box-shadow:0 12px 24px -10px rgba(255,79,139,.7)}
.btn.gh{background:var(--soft)}
.btn.del{color:#e5484d;background:color-mix(in srgb,#e5484d 10%,transparent)}
.pw{margin:-10px -20px 18px;padding:34px 22px 26px;color:#fff;border-radius:32px 32px 0 0;background:radial-gradient(100% 80% at 0 0,#ffb37a,transparent 60%),radial-gradient(90% 90% at 100% 0,#ff4f8b,transparent 60%),linear-gradient(140deg,#ff6a4d,#ff3d77)}
.pw h2{color:#fff;margin:0 0 6px}.pw p{margin:0;opacity:.92}
.feat{display:flex;gap:12px;align-items:center;padding:9px 0;font-weight:500}
.feat i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral);font-style:normal;font-weight:800;flex:none}
.price{display:flex;align-items:baseline;gap:6px;margin:12px 0 2px}.price b{font:800 36px "Inter Tight";letter-spacing:-.03em}
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--app);border-radius:99px;padding:10px 18px;font-size:14px;font-weight:500;z-index:9;transition:.3s;white-space:nowrap;pointer-events:none;max-width:92%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}.pitch{order:2}.phone{order:1;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:600px){.wrap{padding:0}.phone{border-radius:0;padding:0;box-shadow:none}.app{border-radius:0;height:100svh}.status{display:none}.scr{padding-top:16px}.pitch{padding:28px 18px 40px}.plans{grid-template-columns:minmax(0,1fr)}}

/* embed: the app fills the phone screen of the landing page */
html,body{height:100%}body{background:var(--app)}
.wrap{display:block!important;max-width:none!important;padding:0!important;height:100%}
.phone{background:none!important;padding:0!important;border-radius:0!important;box-shadow:none!important;height:100%;max-width:none!important}
.app{height:100%!important;border-radius:0!important}
.status{display:flex!important}.scr{padding-top:0!important}
/* fond noir */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;--app:#0b0b0e}
</style>
</head>
<body>
<div class="wrap">

  <div class="phone">
    <div class="app" id="app">
      <div class="status"><span>9:41</span><div class="island"></div><div class="sig"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg></div></div>
      <div class="toast" id="toast"></div>
      <main class="scr" id="body"></main>
      <div id="dock"></div>
      <nav class="tabbar" role="tablist">
        <button class="tb" role="tab" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
        <button class="tb" role="tab" data-t="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="2"/></svg>Bibliothèque</button>
        <label class="add" aria-label="Ajouter des captures"><input type="file" id="file" accept="image/*" multiple hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></label>
        <button class="tb" role="tab" data-t="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Demander</button>
      </nav>
      <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
    </div>
  </div>
</div>
<script>
{
const T={recette:['Recette','#ff6b3d','#ffe3d6'],produit:['Produit','#3d63ff','#dfe6ff'],lieu:['Lieu','#0fa3a3','#d5f3f1'],evenement:['Événement','#d63384','#fbdcec'],tache:['À faire','#d99a00','#fff1c9'],citation:['Citation','#7a5cff','#e8e2ff'],info:['Info','#6e7080','#e9e9ee']};
const today=new Date();const iso=d=>d.toISOString().slice(0,10);const plus=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return iso(d)};
const seed=[
 {id:'s1',type:'recette',title:'Pâtes crémeuses citron & parmesan',summary:'Recette en 15 min repérée sur TikTok, pour 2 personnes.',actions:['Acheter citrons, parmesan, crème','La cuisiner jeudi soir'],extract:{'Temps':'15 min','Portions':'2'},when:null,tags:['dîner','rapide']},
 {id:'s2',type:'produit',title:'Sneakers New Balance 1906R',summary:'Coloris argent, 159 € sur le site officiel, taille 43 en stock.',actions:['Comparer le prix ailleurs','Acheter avant la fin des soldes'],extract:{'Prix':'159 €','Taille':'43'},when:plus(3),tags:['mode']},
 {id:'s3',type:'lieu',title:'Rooftop « Sky 21 », Dubai Marina',summary:'Bar rooftop recommandé par un ami, réservation conseillée le week-end.',actions:['Réserver pour samedi'],extract:{'Quartier':'Dubai Marina'},when:null,tags:['sortie']},
 {id:'s4',type:'evenement',title:'Conférence IA, billet early bird',summary:'Tarif early bird valable jusqu’à la date indiquée.',actions:['Acheter le billet early bird'],extract:{'Fin early bird':plus(0)},when:plus(0),tags:['business']},
 {id:'s5',type:'citation',title:'« Les gens surestiment ce qu’ils font en un an… »',summary:'Citation sur le long terme, gardée pour la motivation.',actions:[],extract:{},when:null,tags:['mindset']},
 {id:'s6',type:'tache',title:'Renouveler l’assurance voiture',summary:'Mail de rappel de l’assureur : échéance dans 5 jours.',actions:['Comparer 2 devis','Renouveler en ligne'],extract:{'Échéance':plus(5)},when:plus(5),tags:['admin']}
].map(x=>({...x,img:null,done:{},demo:true,ts:Date.now()}));
const LS='kaptaa.demo.v1';let S;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S)S={items:seed,used:0,pro:false};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};

const pic=x=>x.img?`<img src="${x.img}" alt="">`:(ART[x.id]||mock(x));
const fmt=w=>w===iso(today)?"Aujourd'hui":w===plus(1)?'Demain':new Date(w+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
function head(title){const q=S.pro?'<button class="pill pro" data-q>Pro</button>':`<button class="pill" data-q>${Math.max(0,LIMIT-S.used)}/${LIMIT} gratuites</button>`;
 const h=today.getHours();return `<div class="hd"><div><small>${h<18?'Bonjour':'Bonsoir'} · ${today.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</small><h1>${title}</h1></div>${q}</div>`}
function tile(x){const t=ty(x),n=x.actions.length,d=x.actions.filter((_,i)=>x.done[i]).length;
 return `<button class="tile" data-open="${x.id}"><div class="shot">${pic(x)}<span class="badge" style="--c:${t[1]}"><i></i>${t[0]}</span></div><div class="tx"><h3>${esc(x.title)}</h3><small>${n?`${d}/${n} actions`:'À garder'}${x.when?` · ${esc(fmt(x.when))}`:''}</small>${n?`<div class="prog"><i style="width:${d/n*100}%"></i></div>`:''}</div></button>`}
const loaders=()=>Array.from({length:pending},()=>`<div class="tile ld"><div class="shot"><span>L'IA lit ta capture…</span></div><div class="tx"><h3>&nbsp;</h3><small>&nbsp;</small></div></div>`).join('');
function matches(x){const q=query.trim().toLowerCase();if(!q)return true;return [x.title,x.summary,(x.tags||[]).join(' '),Object.values(x.extract||{}).join(' '),ty(x)[0]].join(' ').toLowerCase().includes(q)}
function todoRow(x,i,a,sub){const t=ty(x);return `<label class="todo ${x.done[i]?'done':''}"><input class="chk" type="checkbox" data-id="${x.id}" data-i="${i}" ${x.done[i]?'checked':''}><span><b>${esc(a)}</b>${sub?`<small style="--c:${t[1]}"><i></i>${esc(x.title)}</small>`:''}</span></label>`}
function render(){
 const b=$('body'),dock=$('dock');
 document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===tab));
 dock.innerHTML='';
 if(tab==='today'){
  const todos=[];S.items.forEach(x=>x.actions.forEach((a,i)=>todos.push({x,a,i})));
  const done=todos.filter(t=>t.x.done[t.i]).length,open=todos.length-done;
  const pct=todos.length?done/todos.length:0,C=2*Math.PI*38;
  const soon=S.items.filter(x=>x.when&&x.when>=iso(today)&&x.when<=plus(7)).sort((a,b)=>a.when.localeCompare(b.when));
  const ordered=[...todos.filter(t=>!t.x.done[t.i]),...todos.filter(t=>t.x.done[t.i])];
  b.innerHTML=head("Aujourd'hui")+`<div class="hero"><div style="position:relative;z-index:1"><b>${open}</b><p>action${open>1?'s':''} à faire, tirée${open>1?'s':''} de ${S.items.length} captures${soon.length?` · ${soon.length} échéance${soon.length>1?'s':''} cette semaine`:''}</p></div><div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .5s"/></svg><span>${Math.round(pct*100)}%</span></div></div>
  ${pending?`<div class="sec"><h2>En cours d'analyse</h2></div><div class="grid">${loaders()}</div>`:''}
  ${soon.length?`<div class="sec"><h2>À ne pas rater</h2><small>7 prochains jours</small></div><div class="hs">${soon.map(x=>`<button class="due" data-open="${x.id}" style="--c:${ty(x)[1]}"><div class="dt">${esc(fmt(x.when))}</div><h3>${esc(x.title)}</h3></button>`).join('')}</div>`:''}
  <div class="sec"><h2>Tes actions</h2><small>${done}/${todos.length} faites</small></div>${todos.length?`<div class="list">${ordered.map(t=>todoRow(t.x,t.i,t.a,true)).join('')}</div>`:'<div class="empty">Rien à faire. Ajoute des captures avec le bouton +.</div>'}`;
 }else if(tab==='all'){
  const counts={};S.items.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);
  const chips=[['all','Tout',S.items.length,'var(--ink)'],...Object.keys(T).filter(k=>counts[k]).map(k=>[k,T[k][0],counts[k],T[k][1]])];
  const list=S.items.filter(x=>(filt==='all'||x.type===filt)&&matches(x));
  b.innerHTML=head('Bibliothèque')+`<div class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un prix, un lieu, un mot…" aria-label="Rechercher" value="${esc(query)}"></div>
  <div class="chips">${chips.map(c=>`<button class="chip" data-f="${c[0]}" aria-pressed="${filt===c[0]}" style="--c:${c[3]}">${c[0]==='all'?'':'<i></i>'}${c[1]} <em>${c[2]}</em></button>`).join('')}</div>
  <div class="grid">${loaders()}${list.map(tile).join('')||(pending?'':'<div class="empty">Aucune capture ne correspond.</div>')}</div>`;
 }else{
  const sug=['Qu’est-ce que je dois acheter ?','Des idées de sortie ce week-end ?','Résume mes captures business','Qu’est-ce qui expire bientôt ?'];
  b.innerHTML=head('Demander')+(chat.length?chat.map(m=>`<div class="msg ${m.role==='user'?'me':'ai'}">${m.content===''?'<span class="dots"><i></i><i></i><i></i></span>':esc(m.content)}</div>`).join(''):`<p style="color:var(--mute);margin:0 2px 16px">Pose une question, l'IA répond à partir de toutes tes captures.</p><div class="sugg">${sug.map(s=>`<button class="sg" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`)
   ;
  dock.innerHTML=`<form class="compose" id="askf"><input id="askq" placeholder="Demande à tes captures…" aria-label="Question" autocomplete="off"><button class="send" aria-label="Envoyer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>`;
  b.scrollTop=b.scrollHeight;
 }
}
function open(id){const x=S.items.find(i=>i.id===id);if(!x)return;const t=ty(x);const kv=Object.entries(x.extract||{});
 $('panel').innerHTML=`<div class="grab"></div><div class="big">${pic(x)}</div><span class="tg" style="--c:${t[1]}"><i></i>${t[0]}</span><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p>
 ${kv.length?`<div class="facts">${kv.map(([k,v])=>`<div class="fact"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}
 ${x.actions.length?`<div class="list">${x.actions.map((a,i)=>todoRow(x,i,a,false)).join('')}</div>`:''}
 ${(x.tags||[]).length?`<div class="hash">${x.tags.map(g=>`<span>#${esc(g)}</span>`).join('')}</div>`:''}
 <div class="btns"><button class="btn del" data-del="${x.id}">Supprimer</button><button class="btn pri" data-close>Terminé</button></div>`;
 $('sheet').classList.add('on');$('panel').scrollTop=0}
function paywall(){$('panel').innerHTML=`<div class="pw"><h2>Passe à Kaptaa Pro</h2><p>Tu as utilisé tes ${LIMIT} captures gratuites ce mois-ci.</p></div>
 ${[['∞','Captures illimitées'],['?','Demande à tes captures'],['☀','Digest quotidien et rappels'],['↗','Export vers ton agenda']].map(f=>`<div class="feat"><i>${f[0]}</i>${f[1]}</div>`).join('')}
 <div class="price"><b>19,99 €</b><span style="color:var(--mute)">/mois · annulable à tout moment</span></div>
 <div class="btns"><button class="btn gh" data-close>Plus tard</button><button class="btn gr" data-pro>Essai gratuit 7 jours</button></div><p class="note" style="text-align:center">Démo : aucun paiement.</p>`;
 $('sheet').classList.add('on')}
function close(){$('sheet').classList.remove('on');render()}
function shrink(file,max){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(bl=>ok({blob:bl,url:c.toDataURL('image/jpeg',.72)}),'image/jpeg',.85)};img.onerror=ko;img.src=URL.createObjectURL(file)})}
const PROMPT=`Tu es Kaptaa, une app qui transforme des captures d'écran en actions. Analyse l'image jointe (capture d'écran de téléphone). Date du jour : ${iso(today)}.
Réponds UNIQUEMENT avec un objet JSON valide, en français, de cette forme :
{"type":"recette|produit|lieu|evenement|tache|citation|info","title":"titre court et précis (max 60 caractères)","summary":"une phrase qui dit ce que c'est et pourquoi c'est utile","actions":["0 à 3 actions concrètes que l'utilisateur voudra probablement faire"],"extract":{"Libellé":"valeur clé lue dans l'image (prix, adresse, date, ingrédients principaux, auteur...) max 4 entrées"},"when":"AAAA-MM-JJ si une date/échéance est visible, sinon null","tags":["1 à 3 mots-clés"]}`;
async function analyse(file){
 const {blob}=await shrink(file,1400);const th=await shrink(file,480);
 let r;
 try{if(sample.json){r=await sample.json(PROMPT,{images:[blob],modelTier:'default'})}else{const o=await sample(PROMPT,{images:[blob]});r=JSON.parse(o.text.replace(/^[^{]*/,'').replace(/[^}]*$/,''))}}
 catch(e){if(e&&e.code==='not_granted'){sample=null}throw e}
 if(typeof r==='string')r=JSON.parse(r);
 return {id:'u'+Date.now()+Math.random().toString(36).slice(2,6),type:T[r.type]?r.type:'info',title:r.title||'Capture',summary:r.summary||'',actions:Array.isArray(r.actions)?r.actions.slice(0,3):[],extract:r.extract&&typeof r.extract==='object'?r.extract:{},when:/^\d{4}-\d{2}-\d{2}$/.test(r.when||'')?r.when:null,tags:Array.isArray(r.tags)?r.tags.slice(0,3):[],img:th.url,done:{},ts:Date.now()};
}
$('file').addEventListener('change',async e=>{
 const files=[...e.target.files];e.target.value='';if(!files.length)return;
 if(!sample){toast("Dans l'app, l'IA lit tes vraies captures");setTimeout(()=>{try{parent.postMessage('kaptaa:signup','*')}catch(_){}},900);return}
 const left=S.pro?files.length:Math.max(0,LIMIT-S.used);
 if(!left){paywall();return}
 const run=files.slice(0,left);pending+=run.length;tab='all';filt='all';render();
 const res=await Promise.allSettled(run.map(f=>analyse(f).then(x=>{S.items.unshift(x);S.used++;save();pending--;render();return x}).catch(err=>{pending--;render();throw err})));
 const ok=res.filter(r=>r.status==='fulfilled').length,bad=res.length-ok;
 const rl=res.some(r=>r.reason&&r.reason.code==='rate_limited');
 toast(bad?(rl?'Trop de demandes, réessaie dans un instant.':`${ok} analysée(s), ${bad} en échec`):`${ok} capture${ok>1?'s':''} rangée${ok>1?'s':''} ✓`);
 if(files.length>left)setTimeout(paywall,700);
});

const CANNED=[
 [/achet/i,"D’après tes captures, tu voulais acheter :\n• Citrons, parmesan et crème, pour les pâtes citron & parmesan\n• Les New Balance 1906R à 159 € en 43, avant la fin des soldes\n• Le billet early bird de la conférence IA, c’est le dernier jour"],
 [/sortie|week/i,"Pour ce week-end :\n• Le rooftop « Sky 21 » à Dubai Marina. Réserve pour samedi, c’est conseillé le week-end.\n• Et si tu restes chez toi : les pâtes citron & parmesan, 15 min pour 2."],
 [/business/i,"Côté business :\n• Conférence IA : le tarif early bird se termine aujourd’hui\n• Une citation gardée pour la motivation : « Les gens surestiment ce qu’ils font en un an… »"],
 [/expire|bient/i,"Ce qui arrive bientôt :\n• Aujourd’hui : billet early bird de la conférence IA\n• Dans 3 jours : les sneakers à 159 €\n• Dans 5 jours : renouveler l’assurance voiture"]
];
function demoAsk(q){
 busy=true;chat.push({role:'user',content:q});chat.push({role:'assistant',content:''});render();
 const hit=CANNED.find(c=>c[0].test(q));
 const full=hit?hit[1]:"Dans cette démo, je réponds aux questions suggérées. Dans l’app, je réponds à partir de toutes tes vraies captures.";
 let i=0;setTimeout(function step(){i=Math.min(full.length,i+4);chat[chat.length-1].content=full.slice(0,i);render();if(i<full.length)setTimeout(step,18);else busy=false},500);
}
async function ask(q){
 if(!q||busy)return;if(!sample){return demoAsk(q)}
 busy=true;chat.push({role:'user',content:q});chat.push({role:'assistant',content:''});render();
 const data=S.items.map(x=>({type:x.type,title:x.title,summary:x.summary,actions:x.actions,extract:x.extract,when:x.when,tags:x.tags}));
 const msgs=[{role:'user',content:`Tu es Kaptaa. Voici les captures d'écran déjà analysées de l'utilisateur (JSON) :\n${JSON.stringify(data)}\nDate du jour : ${iso(today)}.\nRéponds à sa question en français, en t'appuyant uniquement sur ces captures, de façon brève et concrète (listes courtes si utile, pas de markdown). Si rien ne correspond, dis-le.\n\nQuestion : ${q}`}];
 try{const o=await sample(msgs,{cache:false,onText:({text})=>{if(text&&text!=='Thinking...'){chat[chat.length-1].content=text;render()}}});chat[chat.length-1].content=o.text}
 catch(e){chat[chat.length-1].content=e&&e.code==='rate_limited'?'Trop de demandes, réessaie dans un instant.':'Impossible de répondre pour le moment.'}
 busy=false;render();
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-t],[data-f],[data-open],[data-close],[data-del],[data-pro],[data-s],[data-q]');if(!g)return;
 if(g.dataset.t){tab=g.dataset.t;render();$('body').scrollTop=tab==='ask'?$('body').scrollHeight:0}
 else if(g.dataset.f){filt=g.dataset.f;render()}
 else if(g.dataset.open)open(g.dataset.open);
 else if(g.hasAttribute('data-close'))close();
 else if(g.dataset.del){S.items=S.items.filter(x=>x.id!==g.dataset.del);save();close();toast('Capture supprimée')}
 else if(g.hasAttribute('data-pro')){close();toast('Réserve ta place : les 100 premiers ont Kaptaa gratuit');setTimeout(()=>{try{parent.postMessage('kaptaa:signup','*')}catch(_){}},900)}
 else if(g.dataset.s)ask(g.dataset.s);
 else if(g.hasAttribute('data-q')&&!S.pro)paywall();
});
document.addEventListener('change',e=>{const c=e.target;if(c.matches('input.chk[data-id]')){const x=S.items.find(i=>i.id===c.dataset.id);if(x){x.done[c.dataset.i]=c.checked;save();c.closest('.todo').classList.toggle('done',c.checked);if(!$('sheet').classList.contains('on'))setTimeout(render,250)}}});
document.addEventListener('submit',e=>{if(e.target.id==='askf'){e.preventDefault();const i=$('askq');const v=i.value.trim();i.value='';ask(v)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;const pos=e.target.selectionStart;render();const n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')close()});
render();
}
</script>
</body>
